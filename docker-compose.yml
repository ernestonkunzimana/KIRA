version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kira_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kira_platform}
      POSTGRES_USER: ${POSTGRES_USER:-kira_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kira_user} -d ${POSTGRES_DB:-kira_platform}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks:
      - edge-mesh-network

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kira_backend_api
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-kira_user}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-kira_platform}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - edge-mesh-network

  frontend-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kira_frontend_dashboard
    ports:
      - "3000:80"
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge-mesh-network

  mqtt-broker:
    image: eclipse-mosquitto:2.0.18
    container_name: edge_mqtt_broker
    ports:
      - "8883:8883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./certs:/mosquitto/config/certs:ro
      - ./data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "8883", "-C", "1", "-t", "broker/ping", "--cafile", "/mosquitto/config/certs/ca.crt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - edge-mesh-network

  iot-sensor-fleet:
    build:
      context: .
      dockerfile: Dockerfile.apps
      args:
        INSTALL_DEV: "false"
    container_name: iot_sensor_fleet
    environment:
      MQTT_BROKER: ${MQTT_BROKER:-mqtt-broker}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_CA_CERT: /app/certs/ca.crt
      MQTT_CLIENT_CERT: /app/certs/client.crt
      MQTT_CLIENT_KEY: /app/certs/client.key
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./src:/app/src:ro
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
    command: python /app/src/sensor_simulator.py
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: on-failure:5
    networks:
      - edge-mesh-network

  adversary-attacker:
    build:
      context: .
      dockerfile: Dockerfile.apps
      args:
        INSTALL_DEV: "false"
    container_name: adversary_attacker
    environment:
      MQTT_BROKER: ${MQTT_BROKER:-mqtt-broker}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_CA_CERT: /app/certs/ca.crt
      MQTT_CLIENT_CERT: /app/certs/client.crt
      MQTT_CLIENT_KEY: /app/certs/client.key
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./src:/app/src:ro
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
    command: python /app/src/attack_simulator.py
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: on-failure:3
    networks:
      - edge-mesh-network

  edge-ai-agent:
    build:
      context: .
      dockerfile: Dockerfile.apps
      args:
        INSTALL_DEV: "false"
    container_name: edge_ai_agent
    environment:
      MQTT_BROKER: ${MQTT_BROKER:-mqtt-broker}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_CA_CERT: /app/certs/ca.crt
      MQTT_CLIENT_CERT: /app/certs/client.crt
      MQTT_CLIENT_KEY: /app/certs/client.key
      MQTT_TLS_INSECURE: ${MQTT_TLS_INSECURE:-false}
      TRAINING_THRESHOLD: ${TRAINING_THRESHOLD:-30}
      CONTAMINATION_RATE: ${CONTAMINATION_RATE:-0.01}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend-api:8000}
    volumes:
      - ./src:/app/src:ro
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
      - ./data:/app/data
    command: python /app/src/edge_ai_anomaly_detection.py
    depends_on:
      mqtt-broker:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge-mesh-network

networks:
  edge-mesh-network:
    driver: bridge

volumes:
  postgres-data:
