version: '3.8'

# .env variables required: SECRET_KEY, JWT_SECRET_KEY, DATABASE_URL (optional)
services:
  redis:
    image: redis:7.2-alpine
    container_name: kira-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - kira-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Resource limits (adjust for your environment)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  backend:
    build:
      context: ./kigali_watchman/backend
      dockerfile: Dockerfile.prod
    container_name: kira-backend-prod
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DEBUG=${DEBUG:-false}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:-sqlite:///kira_audit.db}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - API_WORKERS=${API_WORKERS:-4}
      - API_THREADS=${API_THREADS:-4}
      - API_TIMEOUT=${API_TIMEOUT:-120}
    volumes:
      - ./kigali_watchman/backend/models:/app/models:ro
      - ./logs:/app/logs
      - kira_audit_data:/app/audit
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kira-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '${CONTAINER_CPU_LIMIT:-1}'
          memory: ${CONTAINER_MEMORY_LIMIT:-2g}
        reservations:
          cpus: '0.5'
          memory: 1g

  dashboard:
    build:
      context: ./kigali_watchman/frontend
      dockerfile: Dockerfile.prod
    container_name: kira-dashboard-prod
    restart: unless-stopped
    ports:
      - "${STREAMLIT_SERVER_PORT:-8501}:8501"
    environment:
      - KIRA_API_URL=http://backend:${API_PORT:-5000}
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_CLIENT_TOOLBARPOSITION=top
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kira-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 20s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1.5g
        reservations:
          cpus: '0.5'
          memory: 1g

  nginx:
    image: nginx:1.25-alpine
    container_name: kira-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
      # For TLS certs mount letsencrypt folder in production
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    networks:
      - kira-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 10s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  kira_audit_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  kira-network:
    driver: bridge
